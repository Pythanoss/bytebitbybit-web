<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ByteBitByBit</title>
<meta name="description" content="ByteBitByBit makes small, carefully built apps and games.">
<link rel="canonical" href="https://bytebitbybit.com/">
<style>
:root { --bg:#f7f5fc; --card:#fff; --ink:#1f1a2e; --mute:#6c6582; --line:#e6e1f0; --violet:#6d4bd1; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--ink); font:17px/1.6 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
header { background:linear-gradient(120deg,#6d4bd1,#9b5de5 55%,#f2a65a); color:#fff; padding:72px 16px 88px; text-align:center; }
header h1 { margin:0; font-size:clamp(36px,8vw,56px); letter-spacing:-.02em; }
header p { margin:8px auto 0; max-width:520px; opacity:.92; font-size:19px; }
main { max-width:860px; margin:-52px auto 0; padding:0 16px 48px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:16px; }
.card { display:flex; gap:16px; align-items:center; background:var(--card); border:1px solid var(--line); border-radius:18px; padding:18px; text-decoration:none; color:inherit; box-shadow:0 8px 24px rgba(60,40,120,.08); transition:transform .15s; }
.card:hover { transform:translateY(-2px); }
.card img { width:64px; height:64px; border-radius:16px; flex:none; }
.card b { display:block; font-size:18px; }
.card span { color:var(--mute); font-size:15px; }
footer { text-align:center; color:var(--mute); font-size:14px; padding:40px 16px; }
a { color:var(--violet); }
</style>
</head>
<body>
<header>
  <h1>ByteBitByBit</h1>
  <p>Small, carefully built apps and games.</p>
</header>
<main>
  <div class="grid">
    <a class="card" href="https://magicseal.bytebitbybit.com">
      <img src="https://magicseal.bytebitbybit.com/icon.png" alt="">
      <div><b>Magic Seal</b><span>A calm constellation puzzle for Android.</span></div>
    </a>
  </div>
</main>
<footer>Contact: <a href="mailto:support@bytebitbybit.com">support@bytebitbybit.com</a></footer>
</body>
</html>
